<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aesthetic Pastel Timetable</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap');

  :root {
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --text-dark: #1e293b;
    --text-muted: #64748b;
    --border-light: #f1f5f9;
    
    /* Aesthetic Color Palette */
    --mon: #ffd1dc; /* Soft Rose */
    --tue: #ffe4e1; /* Misty Rose */
    --wed: #fff0f5; /* Lavender Blush */
    --thu: #e6e6fa; /* Lavender */
    --fri: #d0f0c0; /* Tea Green */
    --sat: #e0f6ff; /* Baby Blue */
    --sun: #fff5ba; /* Pastel Yellow */
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Outfit', sans-serif;
  }

  body {
    background-color: var(--bg);
    background-image: radial-gradient(#cbd5e1 0.8px, transparent 0.8px);
    background-size: 16px 16px;
    color: var(--text-dark);
    padding: 2rem;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .planner-card {
    width: 100%;
    max-width: 1150px;
    background: var(--card-bg);
    border-radius: 24px;
    padding: 2.5rem;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 2rem;
    border-bottom: 2px dashed #e2e8f0;
    padding-bottom: 1.2rem;
  }

  .header h1 {
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #0f172a;
  }

  .header p {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin-top: 4px;
  }

  .meta-info {
    display: flex;
    gap: 1rem;
  }

  .meta-field {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 0.4rem 1rem;
    font-size: 0.85rem;
    color: var(--text-muted);
    outline: none;
  }

  .timetable-grid {
    display: grid;
    grid-template-columns: 80px repeat(7, 1fr);
    gap: 8px;
  }

  .cell {
    border-radius: 12px;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.82rem;
  }

  /* Header Cells */
  .header-cell {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-size: 0.75rem;
    padding: 0.8rem 0.2rem;
  }

  .header-cell.time { background: #f1f5f9; color: var(--text-muted); }
  .header-cell.mon { background: var(--mon); color: #881337; }
  .header-cell.tue { background: var(--tue); color: #9f1239; }
  .header-cell.wed { background: var(--wed); color: #831843; }
  .header-cell.thu { background: var(--thu); color: #581c87; }
  .header-cell.fri { background: var(--fri); color: #14532d; }
  .header-cell.sat { background: var(--sat); color: #075985; }
  .header-cell.sun { background: var(--sun); color: #713f12; }

  /* Time Labels */
  .time-cell {
    font-weight: 600;
    color: var(--text-muted);
    font-size: 0.75rem;
    background: #f8fafc;
    border: 1px solid #f1f5f9;
  }

  /* Interactive Slot */
  .slot {
    background: #ffffff;
    border: 1px solid var(--border-light);
    outline: none;
    text-align: center;
    color: var(--text-dark);
    padding: 0.25rem;
    transition: all 0.2s ease;
  }

  .slot:focus, .slot:hover {
    border-color: #cbd5e1;
    background: #fdfdfd;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
  }

  /* Widgets Section */
  .footer-widgets {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1.5rem;
    margin-top: 2rem;
  }

  .widget {
    background: #f8fafc;
    border-radius: 16px;
    padding: 1.2rem;
    border: 1px solid #f1f5f9;
  }

  .widget h3 {
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 0.75rem;
    color: var(--text-dark);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
